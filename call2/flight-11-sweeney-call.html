<style>
  :root { --ink:#efe6d2; --panel:rgba(18,14,12,.94); --accent:#8e1418; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--ink); font-family:Cairo, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:min(100vw, calc(100vh * 16 / 9)); height:auto; aspect-ratio:16/9; display:block; background:#000; }
  #panel { position:fixed; top:16px; right:16px; width:380px; max-width:calc(100vw - 32px); max-height:calc(100vh - 32px); overflow:auto;
           background:var(--panel); border:1px solid #3a2a20; border-radius:10px; padding:14px; z-index:5; font-size:13px; }
  #panel h2 { margin:0 0 6px; font-size:16px; }
  #panel p { margin:0 0 10px; opacity:.7; font-size:12px; line-height:1.6; }
  .cue { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .cue span { flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; opacity:.85; }
  .cue input { width:62px; background:#0d0a08; color:var(--ink); border:1px solid #4a3a2e; border-radius:6px; padding:4px; font:inherit; direction:ltr; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { flex:1; background:#2a1d16; color:var(--ink); border:1px solid #5a4030; border-radius:6px; padding:8px 10px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:#b8343a; }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin-top:8px; font-size:12px; opacity:.8; min-height:1.2em; }
  #show { position:fixed; top:16px; right:16px; z-index:4; display:none; }
  body.hidden #panel { display:none; }
  body.hidden #show { display:block; opacity:.15; }
  body.hidden #show:hover { opacity:1; }
</style>
</head>

// soft, dark, blurred copy of the photo fills the 16:9 frame behind the portrait
function makeBG(){

}

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function download(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }
async function exportMp4(){
  const btn = document.getElementById("mp4"); btn.disabled = true;
  try {
    if (!window.Mp4Muxer) await loadScript("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js");
    const fps = 30, frames = Math.ceil(TL*fps);
    const muxer = new Mp4Muxer.Muxer({ target:new Mp4Muxer.ArrayBufferTarget(), fastStart:"in-memory",
      video:{ codec:"avc", width:W, height:H, frameRate:fps }, audio:{ codec:"aac", numberOfChannels:2, sampleRate:48000 } });
    let err = null;
    const venc = new VideoEncoder({ output:(c,m)=>muxer.addVideoChunk(c,m), error:e=>err=e });
    venc.configure({ codec:"avc1.640028", width:W, height:H, bitrate:12e6, framerate:fps });
    for (let i=0;i<frames;i++){
      if (err) throw err;
      render(i/fps); const f = new VideoFrame(cv, { timestamp:Math.round(i*1e6/fps), duration:Math.round(1e6/fps) });
      venc.encode(f, { keyFrame:i%fps===0 }); f.close();
      while (venc.encodeQueueSize > 6) await new Promise(r=>setTimeout(r,2));
      if (i%15===0){ status(`جارٍ إنشاء الفيديو… ${Math.round(100*i/frames)}٪`); await new Promise(r=>setTimeout(r,0)); }
    }
    await venc.flush();
    const buf = await renderSoundtrack(), n = buf.length, Lc = buf.getChannelData(0), Rc = buf.getChannelData(1);
    const aenc = new AudioEncoder({ output:(c,m)=>muxer.addAudioChunk(c,m), error:e=>err=e });
    aenc.configure({ codec:"mp4a.40.2", sampleRate:48000, numberOfChannels:2, bitrate:192000 });
    for (let s=0;s<n;s+=1024){ const len=Math.min(1024,n-s), data=new Float32Array(len*2); data.set(Lc.subarray(s,s+len),0); data.set(Rc.subarray(s,s+len),len);
      const ad = new AudioData({ format:"f32-planar", sampleRate:48000, numberOfFrames:len, numberOfChannels:2, timestamp:Math.round(s*1e6/48000), data }); aenc.encode(ad); ad.close(); }
    await aenc.flush(); if (err) throw err;
    muxer.finalize(); download(new Blob([muxer.target.buffer], { type:"video/mp4" }), "flight-11-sweeney-call.mp4"); status("تم التنزيل ✓");
  } catch(e){ status("تعذّر إنشاء الفيديو: " + e.message); }
  btn.disabled = false; render(12);
}

function buildUI(){
  const box = document.getElementById("cues");
  box.innerHTML = "";
  CUES.forEach((c,i)=>{
    const row = document.createElement("div"); row.className="cue";
    const s = document.createElement("input"), e = document.createElement("input"), lbl = document.createElement("span");
    s.type = e.type = "number"; s.step = e.step = "0.05"; s.value = c[2]; e.value = c[3]; lbl.textContent = c[1]; lbl.title = c[0]+": "+c[1];
    s.oninput = () => { c[2] = +s.value || 0; saveCues(); if (!playing) render(c[2]+.3); };
    e.oninput = () => { c[3] = +e.value || 0; saveCues(); if (!playing) render(Math.max(c[2], c[3]-.3)); };
    row.append(s, e, lbl); box.appendChild(row);
  });
}
document.getElementById("play").onclick = play;
document.getElementById("mp4").onclick = exportMp4;
document.getElementById("reset").onclick = () => { CUES = DEFAULT_CUES.map(c=>c.slice()); saveCues(); buildUI(); render(12); };
document.getElementById("hide").onclick = () => document.body.classList.add("hidden");
document.getElementById("show").onclick = () => document.body.classList.remove("hidden");
addEventListener("keydown", e => { if (e.target.tagName==="INPUT") return; if (e.key==="h"||e.key==="H") document.body.classList.toggle("hidden"); if (e.key===" "){ e.preventDefault(); play(); } });

(async function init(){
  await Promise.race([document.fonts.load("700 50px Cairo"), new Promise(r=>setTimeout(r,2500))]);
  IMG = await loadImg(PHOTO); BG = makeBG();
  try { BUF = await new OfflineAudioContext(2, 48000, 48000).decodeAudioData(b64(AUDIO)); TL = BUF.duration; makeEnv(); }
  catch(e){ status("تعذّر تحميل صوت المكالمة"); }
  buildUI(); render(12);
  window.__render = render; window.__TL = TL; window.__ready = !!BUF;
})();
