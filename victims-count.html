<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عدد الضحايا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:#00b140; overflow:hidden; font-family:Cairo, sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:min(100vw, calc(100vh * 16 / 9)); height:auto; aspect-ratio:16/9; display:block; }
  #play { position:fixed; bottom:16px; right:16px; z-index:2; background:#13213a; color:#fff; border:1px solid #3b5277; border-radius:6px; padding:8px 16px; font:inherit; cursor:pointer; }
  body.playing #play { display:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<button id="play">▶ تشغيل</button>
<script>
// Chroma-key motion graphic: the counter climbs to the victims' total while a crowd of small
// figures lights up one by one, then the number of countries counts up.
// No green in the artwork and no grain, so it keys cleanly.
const VICTIMS = 2977, COUNTRIES = 90;          // 9/11 victims; nationals of more than 90 countries
const W = 1920, H = 1080, TL = 12, KEY = "#00b140";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1-t, 3);
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const back = t => { const c = 1.7; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };

// crowd: 100 × 30 = 3000 cells, lit in a fixed shuffled order
const COLS = 100, ROWS = 30, CW = 17, CH = 18, GX = (W - COLS*CW)/2, GY = 432;
const ORDER = (() => { const a = [...Array(COLS*ROWS).keys()]; let s = 7; const r = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } const rank = new Array(a.length); a.forEach((c,i) => rank[c] = i); return rank; })();
function sprite(color){
  const c = document.createElement("canvas"); c.width = 22; c.height = 30; const g = c.getContext("2d"); g.fillStyle = color;
  g.beginPath(); g.arc(11, 6, 5, 0, 7); g.fill();
  g.beginPath(); g.moveTo(3, 29); g.quadraticCurveTo(2, 13, 11, 12.5); g.quadraticCurveTo(20, 13, 19, 29); g.closePath(); g.fill();
  return c;
}
const LIT = sprite("#ffffff"), NEW = sprite("#ff4a4a"), DIM = sprite("rgba(10,20,40,.55)");

const T_COUNT = [1.0, 8.4], T_COUNTRY = [9.0, 10.6];
function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
  ctx.fillStyle = KEY; ctx.fillRect(0,0,W,H);
  const cp = easeOut(clamp((t - T_COUNT[0])/(T_COUNT[1]-T_COUNT[0]))), n = Math.round(VICTIMS*cp);

  // crowd (dark backing plate so the figures read on any background once keyed)
  const gA = clamp((t-.4)/.6);
  ctx.globalAlpha = gA*.85; ctx.fillStyle = "#0b1526"; ctx.fillRect(GX-26, GY-24, COLS*CW+52, ROWS*CH+48);
  ctx.globalAlpha = gA; ctx.fillStyle = "#e3262f"; ctx.fillRect(GX-26, GY-24, COLS*CW+52, 5);
  for (let c=0; c<COLS*ROWS; c++){
    const x = GX + (c % COLS)*CW, y = GY + Math.floor(c / COLS)*CH, r = ORDER[c];
    const img = r >= n ? DIM : (r > n - 60 && t < T_COUNT[1] + .2 ? NEW : LIT);
    ctx.drawImage(img, x, y, 12, 16);
  }
  ctx.globalAlpha = 1;

  // big counter
  const inA = clamp((t-.3)/.6), pulse = t > T_COUNT[1] ? 1 + .06*Math.sin(clamp((t-T_COUNT[1])/.5)*Math.PI) : 1;
  ctx.save(); ctx.globalAlpha = inA; ctx.translate(W/2, 250); ctx.scale(pulse, pulse);
  ctx.fillStyle = "rgba(11,21,38,.92)"; ctx.fillRect(-520, -160, 1040, 300);
  ctx.fillStyle = "#e3262f"; ctx.fillRect(513, -160, 7, 300);
  ctx.textAlign = "center"; ctx.direction = "ltr"; ctx.fillStyle = "#ffffff"; ctx.font = "900 210px Cairo";
  ctx.fillText(n.toLocaleString("en-US"), 0, 40);
  ctx.direction = "rtl"; ctx.font = "700 44px Cairo"; ctx.fillStyle = "#ff6a5f"; ctx.fillText("ضحية", 0, 118);
  ctx.restore();
  // heading
  ctx.save(); ctx.globalAlpha = clamp((t-.1)/.5); ctx.textAlign = "center"; ctx.direction = "rtl";
  ctx.fillStyle = "#0b1526"; ctx.fillRect(W/2-300, 18, 600, 56); ctx.fillStyle = "#fff"; ctx.font = "900 36px Cairo"; ctx.fillText("ضحايا 11 سبتمبر 2001", W/2, 58);
  ctx.restore();

  // countries badge
  const k = clamp((t - T_COUNTRY[0])/.5);
  if (k > 0){
    const m = Math.round(COUNTRIES*easeOut(clamp((t - T_COUNTRY[0])/(T_COUNTRY[1]-T_COUNTRY[0]))));
    ctx.save(); ctx.translate(W/2, 1028); const s = back(k); ctx.scale(s, s);
    ctx.fillStyle = "rgba(11,21,38,.95)"; ctx.fillRect(-470, -38, 940, 76); ctx.fillStyle = "#e3262f"; ctx.fillRect(463, -38, 7, 76);
    ctx.textAlign = "center"; ctx.direction = "rtl"; ctx.fillStyle = "#fff"; ctx.font = "900 46px Cairo";
    ctx.fillText("نحو 3000 ضحية من أكثر من " + m + " دولة", 0, 15);
    ctx.restore();
  }
}

document.getElementById("play").onclick = () => {
  const t0 = performance.now(); document.body.classList.add("playing");
  const loop = () => { const t = (performance.now()-t0)/1000; render(clamp(t,0,TL)); if (t<TL) requestAnimationFrame(loop); else document.body.classList.remove("playing"); };
  requestAnimationFrame(loop);
};
document.fonts.load("900 50px Cairo").finally(() => { render(11); window.__render = render; window.__TL = TL; });
</script>
</body>
</html>
